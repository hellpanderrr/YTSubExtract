<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YTSubExtract</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>
      <span>YTSubExtract</span>
    </h1>
    <div class="header-right">
      <a href="https://github.com/hellpanderrr/YTSubExtract" target="_blank" class="github-link" title="View on GitHub">
        <span class="github-icon"></span>
      </a>
      <span class="version">v1.1.0</span>
    </div>
  </header>
  
  <div class="status-container">
    <div id="status-icon" class="spinner"></div>
    <div id="status" class="status-text">Initializing...</div>
    <button id="reset-btn" class="reset-btn" title="Reset Cache & Refresh" style="display: none;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 4v6h-6"></path>
        <path d="M1 20v-6h6"></path>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
    </button>
  </div>
  
  <div class="controls">
    <!-- Source Language -->
    <div class="form-group">
      <label for="lang-select">Source Language</label>
      <select id="lang-select" disabled>
        <option value="" disabled selected>Loading languages...</option>
      </select>
    </div>
    
    <!-- Translation Option -->
    <div class="form-group">
      <div class="translation-toggle">
        <label class="toggle-label" for="translate-check">
          <input type="checkbox" id="translate-check" class="toggle-checkbox" disabled>
          <span>Translate Subtitles</span>
        </label>
      </div>
      
      <div id="translation-options" class="translation-options">
        <label for="translate-lang">Target Language</label>
        <select id="translate-lang" disabled>
          <option value="" disabled selected>Select language...</option>
        </select>
      </div>
    </div>
    
    <!-- Download Buttons -->
    <div class="btn-group">
      <button id="btn-srt" disabled>SRT</button>
      <button id="btn-vtt" disabled>VTT</button>
      <button id="btn-txt" disabled>TXT</button>
    </div>
  </div>

  <!-- Playlist Mode Section -->
  <div id="playlist-mode" class="playlist-mode hidden">
    <div class="playlist-header">
      <h2>Playlist</h2>
      <span id="playlist-count">0 videos</span>
    </div>

    <!-- Playlist Language Controls -->
    <div class="playlist-lang-controls">
      <div class="form-group">
        <label for="playlist-lang-select">Source Language</label>
        <select id="playlist-lang-select">
          <option value="auto" selected>Auto (first available)</option>
          <option value="en">English</option>
          <option value="ru">Russian</option>
          <option value="es">Spanish</option>
          <option value="de">German</option>
          <option value="fr">French</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
        </select>
      </div>

      <div class="form-group">
        <label for="playlist-format-select">Format</label>
        <select id="playlist-format-select">
          <option value="srt" selected>SRT</option>
          <option value="vtt">VTT</option>
          <option value="txt">TXT</option>
        </select>
      </div>

      <div class="form-group">
        <div class="translation-toggle">
          <label class="toggle-label" for="playlist-translate-check">
            <input type="checkbox" id="playlist-translate-check" class="toggle-checkbox">
            <span>Translate Subtitles</span>
          </label>
        </div>

        <div id="playlist-translation-options" class="translation-options">
          <label for="playlist-translate-lang">Target Language</label>
          <select id="playlist-translate-lang" disabled>
            <option value="en">English</option>
            <option value="ru" selected>Russian</option>
            <option value="es">Spanish</option>
            <option value="de">German</option>
            <option value="fr">French</option>
            <option value="zh">Chinese</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
          </select>
        </div>
      </div>
    </div>

    <div class="playlist-controls">
      <label class="select-all-label">
        <input type="checkbox" id="select-all">
        <span>Select all</span>
      </label>
      <span id="selected-count">0 selected</span>
    </div>

    <div id="playlist-videos" class="playlist-videos">
      <!-- Video list populated dynamically -->
    </div>
    
    <div class="playlist-actions">
      <button id="btn-download-zip" disabled>Download ZIP</button>
      <div id="playlist-progress" class="playlist-progress hidden">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="progress-text">0 / 0</span>
      </div>
    </div>
  </div>

  <!-- Logs Section -->
  <div id="logs-container" class="logs-section hidden">
    <div class="logs-header" id="logs-toggle">
      <div class="logs-title">
        <span class="logs-toggle-icon">▶</span>
        <span>Debug Logs</span>
      </div>
      <button id="copy-logs" class="copy-btn">Copy</button>
    </div>
    <div class="logs-content">
      <textarea id="logs" readonly></textarea>
    </div>
  </div>

  <footer>
  </footer>

  <script type="module" src="./popup.js"></script>
</body>
</html>
